hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

ttrl:
  # Whether to enable TTRL, refer to (https://arxiv.org/abs/2504.16084)
  enable: false

  # Number of rollouts per prompt, used for actual training
  n_samples_per_prompt: ${actor_rollout_ref.rollout.n}

  # Number of rollouts per prompt, used for label voting
  n_votes_per_prompt: ${actor_rollout_ref.rollout.n}

ddrl:
  # BCS: Balanced Confidence-Aware Sampling
  # Selects K+ top-frequency positive samples (capped at K/2) and
  # K- = K - K+ lowest-frequency negative samples per prompt,
  # discarding ambiguous medium-frequency responses.
  bcs:
    enable: false

  # DAE: Debiased Advantage Estimation
  # Replaces GRPO group-relative normalization with fixed ±1 advantages
  # (positive → +1, negative → -1), eliminating spurious signal amplification.
  dae:
    enable: false